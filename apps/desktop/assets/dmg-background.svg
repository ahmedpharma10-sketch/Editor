<?xml version="1.0" encoding="UTF-8"?>
<svg width="658" height="498" viewBox="0 0 658 498" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Brand dark-mode base: hsl(0 0% 11%) lifted slightly in the centre -->
    <radialGradient id="bg" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#242424"/>
      <stop offset="55%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#141414"/>
    </radialGradient>
    <!-- Primary/ring accent: hsl(207 100% 50%) -->
    <linearGradient id="arrow" gradientUnits="userSpaceOnUse" x1="262" y1="0" x2="402" y2="0">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#2c9bff"/>
      <stop offset="100%" stop-color="#5cb8ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-120%" width="180%" height="340%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="658" height="498" fill="url(#bg)"/>

  <!-- Brand mark (ds-mark-vector) as a faint watermark -->
  <g transform="translate(247 95) scale(13.6667)" fill="#ffffff" fill-opacity="0.05">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M7.22889 0.429604C6.23675 -0.143201 5.01441 -0.143201 4.02227 0.429604L1.60331 1.8262C0.611176 2.39901 0 3.45759 0 4.60321V7.3964C0 8.54202 0.611176 9.6006 1.60331 10.1734L4.02227 11.57C5.01441 12.1428 6.23675 12.1428 7.22889 11.57L9.64786 10.1734C10.64 9.6006 11.2512 8.54202 11.2512 7.3964V4.60321C11.2512 3.45759 10.64 2.39901 9.64786 1.8262L7.22889 0.429604ZM6.56773 1.72429C5.99497 1.3936 5.28928 1.3936 4.71649 1.72429L2.38791 3.0687C1.81514 3.39941 1.46229 4.01055 1.46229 4.67194V7.36073C1.46229 8.02212 1.81514 8.63326 2.38791 8.96397L4.71649 10.3084C5.28928 10.6391 5.99497 10.6391 6.56773 10.3084L8.89632 8.96397C9.46908 8.63326 9.82194 8.02212 9.82194 7.36073V4.67191C9.82194 4.01055 9.46908 3.39938 8.89632 3.0687L6.56773 1.72429Z"/>
  </g>

  <!-- Instruction line -->
  <text x="329" y="70" text-anchor="middle"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="19" font-weight="500" letter-spacing="0.2"
        fill="#c8c8c8">Drag Diffusion Studio to Applications</text>

  <!-- Modern arrow: glowing rounded shaft + chevron head -->
  <g filter="url(#glow)" fill="none" stroke="url(#arrow)"
     stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M262 344 H398"/>
    <path d="M377 326 L402 344 L377 362"/>
  </g>
</svg>
