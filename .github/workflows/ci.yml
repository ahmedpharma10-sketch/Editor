name: CI

on:
  push:
    branches:
      - main
      - "chatgpt/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare web environment
        run: cp apps/web/.env.example apps/web/.env

      - name: Typecheck shipped workspaces
        # Upstream's root check also compiles optional examples whose README
        # explicitly says require extra project-local packages not installed by this repo.
        run: npm run check --workspaces --if-present

      - name: Lint
        run: npm run lint

      - name: Build web editor
        run: npm run build

      - name: Smoke-test built web editor
        shell: bash
        run: |
          set -euo pipefail
          npm run preview --workspace=@diffusionstudio/web -- --host 127.0.0.1 --port 4173 > /tmp/diffusionstudio-vite.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ -o /tmp/diffusionstudio-index.html; then
              grep -q '<div id="root"></div>' /tmp/diffusionstudio-index.html
              exit 0
            fi
            sleep 1
          done
          cat /tmp/diffusionstudio-vite.log
          exit 1

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: diffusionstudio-web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  hosted-runtime:
    name: Hosted runtime verification
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIVE_BASE_URL: https://diffusion-studio-editor-ahmed.netlify.app
    steps:
      - name: Download exact build from verify job
        uses: actions/download-artifact@v4
        with:
          name: diffusionstudio-web-dist
          path: apps/web/dist

      - name: Verify live headers and source-bound deployed content
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location --head "$LIVE_BASE_URL/" > /tmp/live-headers.txt
          grep -Eqi '^cross-origin-opener-policy:[[:space:]]*same-origin([[:space:]]|$)' /tmp/live-headers.txt
          grep -Eqi '^cross-origin-embedder-policy:[[:space:]]*(credentialless|require-corp)([[:space:]]|$)' /tmp/live-headers.txt
          grep -Ei '^cross-origin-(opener|embedder)-policy:' /tmp/live-headers.txt

          exact_matched=0
          html_checked=0
          while IFS= read -r -d '' local_file; do
            rel="${local_file#apps/web/dist/}"
            encoded_rel="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$rel")"
            live_file="/tmp/live-$((exact_matched + html_checked))"
            curl --fail --silent --show-error --location "$LIVE_BASE_URL/$encoded_rel" -o "$live_file"

            case "$rel" in
              *.html)
                html_checked=$((html_checked + 1))
                case "$rel" in
                  index.html)
                    grep -Fq '<title>Diffusion Studio</title>' "$live_file"
                    grep -Eq '<div[^>]+id=["'"']root["'"']' "$live_file"
                    while IFS= read -r asset_ref; do
                      test -n "$asset_ref"
                      grep -Fq "$asset_ref" "$live_file"
                    done < <(grep -oE '/assets/[^"'"']+\.(js|css)' "$local_file" | sort -u)
                    ;;
                  auth/electron-callback.html)
                    grep -Fq 'diffusion://auth/callback?' "$live_file"
                    ;;
                  checkout/electron-callback.html)
                    grep -Fq 'diffusion://checkout/callback?' "$live_file"
                    ;;
                  *)
                    grep -Fq 'Diffusion Studio' "$live_file"
                    ;;
                esac
                ;;
              *)
                cmp --silent "$local_file" "$live_file" || {
                  echo "Live byte mismatch: $rel"
                  sha256sum "$local_file" "$live_file"
                  exit 1
                }
                exact_matched=$((exact_matched + 1))
                ;;
            esac
          done < <(find apps/web/dist -type f -print0 | sort -z)

          test "$exact_matched" -gt 0
          test "$html_checked" -ge 3
          echo "EXACT_NON_HTML_FILES_MATCH=$exact_matched"
          echo "SEMANTIC_HTML_FILES_CHECKED=$html_checked"

      - name: Install pinned browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/diffusion-runtime-smoke --no-package-lock --no-save playwright@1.55.0
          /tmp/diffusion-runtime-smoke/node_modules/.bin/playwright install --with-deps chromium

      - name: Chromium smoke-test live editor
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('/tmp/diffusion-runtime-smoke/node_modules/playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            const consoleErrors = [];
            const pageErrors = [];
            page.on('console', (msg) => {
              if (msg.type() === 'error') consoleErrors.push(msg.text());
            });
            page.on('pageerror', (error) => pageErrors.push(String(error)));

            const response = await page.goto(process.env.LIVE_BASE_URL, {
              waitUntil: 'networkidle',
              timeout: 60000,
            });
            if (!response || !response.ok()) {
              throw new Error(`Navigation failed: ${response ? response.status() : 'no response'}`);
            }

            await page.waitForSelector('#root > *', { timeout: 30000 });
            const title = await page.title();
            const rootState = await page.locator('#root').evaluate((el) => ({
              children: el.children.length,
              width: el.getBoundingClientRect().width,
              height: el.getBoundingClientRect().height,
              textLength: (el.textContent || '').trim().length,
            }));

            if (title !== 'Diffusion Studio') throw new Error(`Unexpected title: ${title}`);
            if (rootState.children < 1 || rootState.width < 300 || rootState.height < 200) {
              throw new Error(`Editor root did not render: ${JSON.stringify(rootState)}`);
            }

            await page.screenshot({ path: '/tmp/diffusion-studio-live.png', fullPage: true });
            console.log('LIVE_TITLE=' + title);
            console.log('LIVE_ROOT=' + JSON.stringify(rootState));
            console.log('PAGE_ERRORS=' + JSON.stringify(pageErrors));
            console.log('CONSOLE_ERRORS=' + JSON.stringify(consoleErrors));
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload hosted runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diffusionstudio-hosted-runtime-evidence
          path: |
            /tmp/live-headers.txt
            /tmp/diffusion-studio-live.png
          if-no-files-found: warn
          retention-days: 7
