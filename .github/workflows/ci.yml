name: CI

on:
  push:
    branches:
      - main
      - "chatgpt/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare web environment
        run: cp apps/web/.env.example apps/web/.env

      - name: Typecheck
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Build web editor
        run: npm run build

      - name: Smoke-test built web editor
        shell: bash
        run: |
          set -euo pipefail
          npm run preview --workspace=@diffusionstudio/web -- --host 127.0.0.1 --port 4173 > /tmp/diffusionstudio-vite.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ -o /tmp/diffusionstudio-index.html; then
              grep -q '<div id="root"></div>' /tmp/diffusionstudio-index.html
              exit 0
            fi
            sleep 1
          done
          cat /tmp/diffusionstudio-vite.log
          exit 1

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: diffusionstudio-web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7
